[project]
name = "clifilestor"
version = "1.1.0"
description = "CLIF CLI File storage system (CLI Google Drive Essentially)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
]
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wyatt Brashear", email = "admin@wyattb.dev"}
]
[project.optional-dependencies]
server = [
    "flask>=3.1.3",
]
client = []
[project.scripts]
clif = "client.client:main"
clif-server = "server.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["client", "server"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "twine>=6.2.0",
]
